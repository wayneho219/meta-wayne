# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-wayne"
BBFILE_PATTERN_meta-wayne = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-wayne = "6"

LAYERDEPENDS_meta-wayne = "core"
LAYERSERIES_COMPAT_meta-wayne = "scarthgap"
